# Default weighted-ranking configuration for ai-kit-spec-config's model discovery
# (docs/superpowers/specs/2026-09-02-model-discovery-curation-design.md, Section 6).
# Purposes: planning, general, mechanical, execution, review; execute is an alias of execution.
# Fixed defaults -- the user is never asked to tune these per wizard run.

[review]
# Review-focused: balanced intelligence with low price weight
intelligence_index = 0.30
coding_index = 0.10
agentic_index = 0.15
context_window = 0.15
tool_calling = 0.05
price = 0.15
speed = 0.05

[execution]
# Execution-focused: high coding and agentic with high price weight
intelligence_index = 0.10
coding_index = 0.25
agentic_index = 0.20
context_window = 0.05
tool_calling = 0.10
price = 0.25
speed = 0.05

[planning]
# Planning-focused: max intelligence and agentic, low price weight
intelligence_index = 0.40
coding_index = 0.10
agentic_index = 0.25
context_window = 0.10
tool_calling = 0.05
price = 0.05
speed = 0.05

[general]
# General-purpose: balanced score/price
intelligence_index = 0.25
coding_index = 0.15
agentic_index = 0.15
context_window = 0.10
tool_calling = 0.05
price = 0.20
speed = 0.10

[mechanical]
# Mechanical-focused: price-dominant; applies optional floor on raw coding_index
intelligence_index = 0.05
coding_index = 0.15
agentic_index = 0.05
context_window = 0.05
tool_calling = 0.05
price = 0.55
speed = 0.10

[mechanical.floor]
# Optional per-purpose floor on the RAW Artificial Analysis score (not normalized); a candidate
# below it, or without that score, is excluded from the ranking, not zero-scored; any purpose may
# declare one; only mechanical ships with one; without an ARTIFICIAL_ANALYSIS_API_KEY no entry
# has scores, so the mechanical ranking is empty.
coding_index = 35

[bonuses]
# Applied additively to the 0-100 weighted score, capped combined at bonus_cap.
# NOTE: design spec 2026-09-02 Section 6 also names a task_affinity_match=2 bonus, scoped to
# a specific plan/doc's task_affinity -- that context does not exist at this wizard's
# config-time ranking (Task 8), so it is deliberately omitted here rather than wired to a
# fabricated always-None input (see the plan's Global Constraints for the full rationale).
batch_mode = 8
fallback_quota = 5
bonus_cap = 15
