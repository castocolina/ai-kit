# Single source of truth for the quality gate.
#   make validate  →  runs every hook here across all files (parity by construction)
#   make dev       →  installs these hooks, so commits are gated even if validate is skipped
# All python tools come from the uv-locked dev env (`uv run`) — versions live in
# uv.lock, NOT duplicated here. The ai-kit runtime stays stdlib-only; this is dev-only.
#
# Ruff and py-compile cover every shipped Python file under tools, skills and tests.
default_install_hook_types: [pre-commit, pre-push]
# BEGIN GENERATED test groups
# arch: tests.test_arch
# unit-uv: tests.test_framework_profiles
# integration: tests.test_config_doctor tests.test_config_doctor_pty tests.test_wizard_app tests.test_wizard_pty
# e2e: tests.test_ai_kit_gsd_curated_config_matrix tests.test_ai_kit_gsd_spec_discuss_e2e tests.test_ai_kit_project_rules_all_e2e tests.test_ai_kit_spec_e2e tests.test_ai_kit_spec_goal_prompt_e2e tests.test_cross_ai_runner_e2e tests.test_curated_config_apply_e2e tests.test_curated_config_e2e tests.test_hook_registry_e2e tests.test_jev_skill_install_e2e tests.test_markdown_to_pdf_e2e tests.test_precompact_shims_e2e tests.test_staged_commit_e2e tests.test_system_memory_e2e tests.test_worktree_e2e
# unit: tests.test_ai_kit_gsd_curated_config tests.test_ai_kit_gsd_spec_discuss tests.test_ai_kit_opencode_providers tests.test_ai_kit_project_rules_agents tests.test_ai_kit_project_rules_all tests.test_ai_kit_project_rules_arch tests.test_ai_kit_project_rules_cicd tests.test_ai_kit_project_rules_docker tests.test_ai_kit_project_rules_makefile tests.test_ai_kit_project_rules_precommit tests.test_ai_kit_rules_common tests.test_ai_kit_session_wake tests.test_ai_kit_session_wake_fire tests.test_ai_kit_session_wake_reset tests.test_ai_kit_spec tests.test_ai_kit_spec_env_scrub tests.test_ai_kit_spec_goal_prompt_cli tests.test_ai_kit_spec_goal_prompt_common tests.test_ai_kit_spec_goal_prompt_evals tests.test_ai_kit_spec_goal_prompt_golden tests.test_ai_kit_spec_goal_prompt_host tests.test_ai_kit_spec_goal_prompt_matrix tests.test_ai_kit_spec_goal_prompt_objective tests.test_ai_kit_spec_goal_prompt_pointer tests.test_ai_kit_spec_goal_prompt_render tests.test_ai_kit_spec_goal_prompt_scope tests.test_ai_kit_spec_goal_prompt_signals tests.test_ai_kit_spec_goal_prompt_skilltext tests.test_ai_kit_spec_goal_prompt_strategies tests.test_ai_kit_spec_goal_prompt_variants tests.test_ai_kit_spec_gsd tests.test_ai_kit_spec_gsd_tools tests.test_ai_kit_spec_legacy_config tests.test_ai_kit_spec_routing tests.test_ai_kit_spec_runner_dispatch tests.test_ai_kit_spec_runtimes_table tests.test_ai_kit_spec_superpowers tests.test_ai_kit_spec_trust tests.test_ai_kit_usage_metrics tests.test_check_dogfood tests.test_claude_precompact tests.test_claude_session_wake_hook tests.test_cross_ai_catalog tests.test_cross_ai_skill_text tests.test_curated_config_apply tests.test_curated_config_cross_ai tests.test_curated_config_followups tests.test_curated_config_golden tests.test_curated_config_inventory tests.test_curated_config_plan_edit tests.test_curated_config_recommend tests.test_curated_config_script tests.test_curated_config_skills tests.test_cursor_agents tests.test_cursor_fakes tests.test_cursor_quota tests.test_cursor_status_line tests.test_decision_probe tests.test_external_segments tests.test_gate_scope tests.test_gsd_curated_eval tests.test_hook_registry tests.test_jev_fast_decision tests.test_markdown_to_pdf tests.test_mermaid_style tests.test_phase26_owner_captures tests.test_pi_live_tools tests.test_precompact_core tests.test_quota_policy_text tests.test_run_unittest_parallel tests.test_setup tests.test_sibling_resolution tests.test_staged_mapper tests.test_status_line tests.test_statusline_doctor tests.test_tool_advisor_core tests.test_tool_advisor_state tests.test_tool_substitution_hook
# END GENERATED test groups
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        files: ^(tools|skills|tests)/.*\.py$
        require_serial: true
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        # Pylint covers every shipped Python file under tools and skills (not tests).
        files: ^(tools|skills)/.*\.py$
        require_serial: true
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$
      - id: py-compile
        name: py-compile
        entry: python3 -m py_compile
        language: system
        files: ^(tools|skills|tests)/.*\.py$
      # Commit stage: only the modules covering the staged files; shared machinery or a mapper
      # failure runs the full unit and arch groups. The explicit stage keeps it out of pre-push,
      # and verbose shows the selected modules on every commit.
      - id: staged-tests
        name: staged tests (covering modules)
        entry: python3 tools/run_unittest_parallel.py --staged
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit]
      # Tests run on the user's real runtime (system python3, stdlib-only), matching
      # how the status line actually runs. Modules are discovered and grouped by the runner.
      # One subprocess per module, in parallel (tools/run_unittest_parallel.py, stdlib-only).
      - id: unittest
        name: unittest (core)
        entry: python3 tools/run_unittest_parallel.py --group unit --group arch -- tests.test_ai_kit_gsd_curated_config tests.test_ai_kit_gsd_spec_discuss tests.test_ai_kit_opencode_providers tests.test_ai_kit_project_rules_agents tests.test_ai_kit_project_rules_all tests.test_ai_kit_project_rules_arch tests.test_ai_kit_project_rules_cicd tests.test_ai_kit_project_rules_docker tests.test_ai_kit_project_rules_makefile tests.test_ai_kit_project_rules_precommit tests.test_ai_kit_rules_common tests.test_ai_kit_session_wake tests.test_ai_kit_session_wake_fire tests.test_ai_kit_session_wake_reset tests.test_ai_kit_spec tests.test_ai_kit_spec_env_scrub tests.test_ai_kit_spec_goal_prompt_cli tests.test_ai_kit_spec_goal_prompt_common tests.test_ai_kit_spec_goal_prompt_evals tests.test_ai_kit_spec_goal_prompt_golden tests.test_ai_kit_spec_goal_prompt_host tests.test_ai_kit_spec_goal_prompt_matrix tests.test_ai_kit_spec_goal_prompt_objective tests.test_ai_kit_spec_goal_prompt_pointer tests.test_ai_kit_spec_goal_prompt_render tests.test_ai_kit_spec_goal_prompt_scope tests.test_ai_kit_spec_goal_prompt_signals tests.test_ai_kit_spec_goal_prompt_skilltext tests.test_ai_kit_spec_goal_prompt_strategies tests.test_ai_kit_spec_goal_prompt_variants tests.test_ai_kit_spec_gsd tests.test_ai_kit_spec_gsd_tools tests.test_ai_kit_spec_legacy_config tests.test_ai_kit_spec_routing tests.test_ai_kit_spec_runner_dispatch tests.test_ai_kit_spec_runtimes_table tests.test_ai_kit_spec_superpowers tests.test_ai_kit_spec_trust tests.test_ai_kit_usage_metrics tests.test_check_dogfood tests.test_claude_precompact tests.test_claude_session_wake_hook tests.test_cross_ai_catalog tests.test_cross_ai_skill_text tests.test_curated_config_apply tests.test_curated_config_cross_ai tests.test_curated_config_followups tests.test_curated_config_golden tests.test_curated_config_inventory tests.test_curated_config_plan_edit tests.test_curated_config_recommend tests.test_curated_config_script tests.test_curated_config_skills tests.test_cursor_agents tests.test_cursor_fakes tests.test_cursor_quota tests.test_cursor_status_line tests.test_decision_probe tests.test_external_segments tests.test_gate_scope tests.test_gsd_curated_eval tests.test_hook_registry tests.test_jev_fast_decision tests.test_markdown_to_pdf tests.test_mermaid_style tests.test_phase26_owner_captures tests.test_pi_live_tools tests.test_precompact_core tests.test_quota_policy_text tests.test_run_unittest_parallel tests.test_setup tests.test_sibling_resolution tests.test_staged_mapper tests.test_status_line tests.test_statusline_doctor tests.test_tool_advisor_core tests.test_tool_advisor_state tests.test_tool_substitution_hook tests.test_arch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Textual + PTY suites require uv (textual is not installed in the system python3).
      # Runs after the core suite so errors are easy to attribute.
      - id: unittest-wizard
        name: unittest (wizard — uv)
        entry: uv run python tools/run_unittest_parallel.py --group unit-uv --group integration -- tests.test_framework_profiles tests.test_config_doctor tests.test_config_doctor_pty tests.test_wizard_app tests.test_wizard_pty
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # The live-project check (dogfood runner copy pristine, curated-config runs leave the real
      # config untouched); it reads the live .planning/, which tests may not. verbose keeps its
      # ok and skip lines visible on a passing push.
      - id: check-dogfood
        name: check-dogfood (live project)
        entry: python3 tools/check_dogfood.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # Runs the covering e2e modules the commit stage deferred (over COMMIT_E2E_BUDGET_SECS): the
      # pushed range when the proof holds, otherwise every over-budget module. Not part of the 60 s
      # figure for the two test hooks.
      - id: deferred-e2e
        name: deferred e2e (over the commit budget)
        entry: python3 tools/run_unittest_parallel.py --pushed
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
