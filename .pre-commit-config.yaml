# Single source of truth for the quality gate.
#   make validate  →  runs every hook here across all files (parity by construction)
#   make dev       →  installs these hooks, so commits are gated even if validate is skipped
# All python tools come from the uv-locked dev env (`uv run`) — versions live in
# uv.lock, NOT duplicated here. The ai-kit runtime stays stdlib-only; this is dev-only.
#
# Ruff and py-compile cover every shipped Python file under tools, skills and tests.
default_install_hook_types: [pre-commit, pre-push]
# BEGIN GENERATED test groups
# arch: tests.test_arch
# unit-uv: tests.test_framework_profiles
# integration: tests.test_config_doctor tests.test_config_doctor_pty tests.test_wizard_app tests.test_wizard_pty
# e2e: tests.test_ai_kit_gsd_spec_discuss_e2e tests.test_ai_kit_spec_e2e tests.test_cross_ai_runner_e2e tests.test_curated_config_apply_e2e tests.test_curated_config_e2e tests.test_system_memory_e2e tests.test_worktree_e2e
# unit: tests.test_ai_kit_gsd_curated_config tests.test_ai_kit_gsd_spec_discuss tests.test_ai_kit_opencode_providers tests.test_ai_kit_project_rules_agents tests.test_ai_kit_project_rules_all tests.test_ai_kit_project_rules_arch tests.test_ai_kit_project_rules_cicd tests.test_ai_kit_project_rules_docker tests.test_ai_kit_project_rules_makefile tests.test_ai_kit_project_rules_precommit tests.test_ai_kit_rules_common tests.test_ai_kit_spec tests.test_ai_kit_spec_env_scrub tests.test_ai_kit_spec_gsd tests.test_ai_kit_spec_gsd_tools tests.test_ai_kit_spec_legacy_config tests.test_ai_kit_spec_routing tests.test_ai_kit_spec_runner_dispatch tests.test_ai_kit_spec_runtimes_table tests.test_ai_kit_spec_superpowers tests.test_ai_kit_spec_trust tests.test_ai_kit_usage_metrics tests.test_curated_config_apply tests.test_curated_config_cross_ai tests.test_curated_config_followups tests.test_curated_config_golden tests.test_curated_config_inventory tests.test_curated_config_plan_edit tests.test_curated_config_recommend tests.test_curated_config_script tests.test_curated_config_skills tests.test_external_segments tests.test_gate_scope tests.test_markdown_to_pdf tests.test_mermaid_style tests.test_run_unittest_parallel tests.test_setup tests.test_sibling_resolution tests.test_status_line tests.test_statusline_doctor tests.test_tool_substitution_hook
# END GENERATED test groups
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        files: ^(tools|skills|tests)/.*\.py$
        require_serial: true
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        # Pylint covers every shipped Python file under tools and skills (not tests).
        files: ^(tools|skills)/.*\.py$
        require_serial: true
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$
      - id: py-compile
        name: py-compile
        entry: python3 -m py_compile
        language: system
        files: ^(tools|skills|tests)/.*\.py$
      # Tests run on the user's real runtime (system python3, stdlib-only), matching
      # how the status line actually runs. Modules are discovered and grouped by the runner.
      # One subprocess per module, in parallel (tools/run_unittest_parallel.py, stdlib-only).
      - id: unittest
        name: unittest (core)
        entry: python3 tools/run_unittest_parallel.py --group unit --group arch -- tests.test_ai_kit_gsd_curated_config tests.test_ai_kit_gsd_spec_discuss tests.test_ai_kit_opencode_providers tests.test_ai_kit_project_rules_agents tests.test_ai_kit_project_rules_all tests.test_ai_kit_project_rules_arch tests.test_ai_kit_project_rules_cicd tests.test_ai_kit_project_rules_docker tests.test_ai_kit_project_rules_makefile tests.test_ai_kit_project_rules_precommit tests.test_ai_kit_rules_common tests.test_ai_kit_spec tests.test_ai_kit_spec_env_scrub tests.test_ai_kit_spec_gsd tests.test_ai_kit_spec_gsd_tools tests.test_ai_kit_spec_legacy_config tests.test_ai_kit_spec_routing tests.test_ai_kit_spec_runner_dispatch tests.test_ai_kit_spec_runtimes_table tests.test_ai_kit_spec_superpowers tests.test_ai_kit_spec_trust tests.test_ai_kit_usage_metrics tests.test_curated_config_apply tests.test_curated_config_cross_ai tests.test_curated_config_followups tests.test_curated_config_golden tests.test_curated_config_inventory tests.test_curated_config_plan_edit tests.test_curated_config_recommend tests.test_curated_config_script tests.test_curated_config_skills tests.test_external_segments tests.test_gate_scope tests.test_markdown_to_pdf tests.test_mermaid_style tests.test_run_unittest_parallel tests.test_setup tests.test_sibling_resolution tests.test_status_line tests.test_statusline_doctor tests.test_tool_substitution_hook tests.test_arch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Textual + PTY suites require uv (textual is not installed in the system python3).
      # Runs after the core suite so errors are easy to attribute.
      - id: unittest-wizard
        name: unittest (wizard — uv)
        entry: uv run python tools/run_unittest_parallel.py --group unit-uv --group integration -- tests.test_framework_profiles tests.test_config_doctor tests.test_config_doctor_pty tests.test_wizard_app tests.test_wizard_pty
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
